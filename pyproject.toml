# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["closest_river/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
# T038: djlint does not know allauth's {% slot %} tag, so every {% endslot %}
# in the vendored allauth element templates reads as unmatched.
ignore = "H006,H030,H031,T002,H025,T038"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py312"
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TCH",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "PLC0415", # `import` should be at the top-level of a file. The imports that
             # are not are deliberate: models and tasks imported inside a
             # function to keep app loading and Celery's import of tasks.py
             # from pulling in the world.
]

[tool.ruff.lint.per-file-ignores]
# Cookiecutter boilerplate, exempted from linting wholesale by a blanket
# `# ruff: noqa`. PGH004 wants specific codes instead, which would mean
# rediscovering the whole list every time the template moves.
"manage.py" = ["PGH004"]
"merge_production_dotenvs_in_dotenv.py" = ["PGH004"]
"config/urls.py" = ["PGH004"]
"config/wsgi.py" = ["PGH004"]
"docs/conf.py" = ["PGH004"]
# In tests, literal ids and status codes read better than named constants, and
# assertions against schema-qualified table names are not injection vectors.
"**/tests/**" = [
  "PLR2004",  # Magic value used in comparison
  "S608",     # Possible SQL injection via string construction
  "SLF001",   # Private member access (Model._meta)
]

[tool.ruff.lint.isort]
force-single-line = true
