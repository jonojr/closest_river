volumes:
  closest_river_local_postgres_data: {}
  closest_river_local_postgres_data_backups: {}
  closest_river_local_redis_data: {}
  # Working area for downloaded extracts and filtered PBFs.
  closest_river_local_osm_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: python-run-stage
    image: closest_river_local_django
    container_name: closest_river_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    platform: linux/amd64
    image: closest_river_production_postgres
    container_name: closest_river_local_postgres
    volumes:
      - closest_river_local_postgres_data:/var/lib/postgresql/data
      - closest_river_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    ports:
      - '5432:5432'

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: closest_river_local_mailpit
    ports:
      - '8025:8025'

  redis:
    image: valkey/valkey:7
    container_name: closest_river_local_redis

    volumes:
      - closest_river_local_redis_data:/data

  # Separate instance from the broker. Cached tiles are bulky and long-lived,
  # so this one is memory-capped with LRU eviction — which must never be
  # applied to the instance holding the Celery queue.
  redis-cache:
    image: valkey/valkey:7
    container_name: closest_river_local_redis_cache
    command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ''

  celeryworker:
    <<: *django
    image: closest_river_local_celeryworker
    container_name: closest_river_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: closest_river_local_celerybeat
    container_name: closest_river_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: closest_river_local_flower
    container_name: closest_river_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  osmworker:
    <<: *django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      target: osm-tools
    image: closest_river_local_osmworker
    container_name: closest_river_local_osmworker
    depends_on:
      - redis
      - postgres
    volumes:
      - .:/app:z
      - closest_river_local_osm_data:/data
    ports: []
    command: /start-osmworker

  # The self-hosted basemap, from ./basemap (gitignored), with production's
  # nginx config. The webpack dev server proxies /tiles/ here. Fill it with
  #   docker compose -f docker-compose.local.yml run --rm osmworker \
  #     python manage.py fetch_basemap
  tiles:
    image: docker.io/nginx:1.29.4-alpine
    container_name: closest_river_local_tiles
    volumes:
      - ./compose/production/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./basemap:/usr/share/nginx/tiles:ro

  node:
    build:
      context: .
      dockerfile: ./compose/local/node/Dockerfile
    image: closest_river_local_node
    container_name: closest_river_local_node
    depends_on:
      - django
      - tiles
    volumes:
      - .:/app:z
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - /app/node_modules
    command: npm run dev
    ports:
      - '3000:3000'
