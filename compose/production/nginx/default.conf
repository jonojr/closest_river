server {
  listen       80;
  server_name  localhost;
  location /media/ {
    alias /usr/share/nginx/media/;
  }

  # The self-hosted basemap: written by rivers/basemap.py into BASEMAP_DIR,
  # mounted here read-only. MapLibre reads the .pmtiles archives with Range
  # requests, which nginx answers from static files as they are.
  location /tiles/ {
    alias /usr/share/nginx/tiles/;
    # The tiles inside an archive are already compressed, and gzip would
    # break Range responses.
    gzip off;
    # Fonts and sprites only change when BASEMAP_ASSETS_REF does.
    add_header Cache-Control "public, max-age=86400";

    # A refresh renames a new archive over the old one, so revalidate soon;
    # the pmtiles client notices the changed ETag and rereads the header.
    location ~ \.pmtiles$ {
      add_header Cache-Control "public, max-age=300";
    }
  }
}
