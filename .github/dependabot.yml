# Config for Dependabot updates. See Documentation here:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Update GitHub actions in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  # Docker: dependencies where only patch updates are wanted
  # (Python base images etc. - ignore major/minor, e.g. 3.10 -> 3.11)
  - package-ecosystem: 'docker'
    directories:
      - 'compose/local/django/'
      - 'compose/local/docs/'
      - 'compose/production/django/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
    groups:
      docker-patch-updates:
        patterns:
          - '*'

  # Docker: everything else, all update types allowed
  - package-ecosystem: 'docker'
    directories:
      - 'compose/local/node/'
      - 'compose/production/aws/'
      - 'compose/production/postgres/'
      - 'compose/production/traefik/'
      - 'compose/production/nginx/'
    schedule:
      interval: 'weekly'
    groups:
      docker-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
      # Majors get one grouped PR too; remove this block if you'd rather
      # have them arrive individually
      docker-major:
        update-types:
          - 'major'

  # Python/pip - production
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      python-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # JavaScript/npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-dev:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      npm-prod:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
